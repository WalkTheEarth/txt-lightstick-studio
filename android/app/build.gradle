plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.walktheearth.txtlightstick'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "io.github.walktheearth.txtlightstick"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "0.1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
