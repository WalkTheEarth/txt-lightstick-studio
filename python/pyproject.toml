[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txtlightstick"
version = "0.1.0"
description = "Control the TXT Official Light Stick Ver.2 over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
txtlightstick = "txtlightstick.__main__:main"

[tool.setuptools]
packages = ["txtlightstick"]
